query CrmPeople {
  people {
    id
    linkedinUrn
    firstName
    lastName
    headline
    currentTitle
    currentCompanyName
    lifecycleStage
    connectionStatus
    outreachStatus
    companyRelationships {
      companyId
      roleTitle
      isCurrent
      company {
        id
        name
      }
    }
    updatedAt
  }
}
