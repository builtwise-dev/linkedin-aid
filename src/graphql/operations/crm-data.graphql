query CrmData {
  savedLeads {
    id
    linkedinUrn
    firstName
    lastName
    headline
    currentTitle
    currentCompanyName
    status
    updatedAt
  }
  companies {
    id
    linkedinUrn
    name
    industry
    location
    status
    updatedAt
  }
  crmNotes {
    id
    body
    savedLeadId
    companyId
    createdAt
  }
  crmTags {
    id
    name
    createdAt
  }
  crmTasks {
    id
    title
    description
    status
    dueAt
    savedLeadId
    companyId
    updatedAt
  }
  crmInteractions {
    id
    kind
    summary
    channel
    outcome
    occurredAt
    savedLeadId
    companyId
  }
}
